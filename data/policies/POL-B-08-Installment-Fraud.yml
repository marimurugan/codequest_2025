id: POL-B-08
version: 1.0
effective_from: 2025-09-01
category: B
scenario: Installment fraud
summary: Large early purchases then default; device/IP novelty; shipments to reshipper addresses.
signals:
  - {key: large_installments_7d, op: ">=", value: 2, timeframe: "7d", weight: 15}
  - {key: new_device_rate_7d, op: ">=", value: 0.5, timeframe: "7d", weight: 10}
  - {key: reshipper_address_hits_90d, op: ">=", value: 1, timeframe: "90d", weight: 10}
decision:
  severity_buckets: [{min: 40, label: HIGH}, {min: 20, label: MEDIUM}, {min: 0, label: LOW}]
  actions:
    HIGH: {recommendation: ESCALATE, steps: ["Hold shipment","ID verification"], sla: "24h"}
    MEDIUM: {recommendation: REQUEST_DOCS, steps: ["Income proof"], sla: "48h"}
    LOW: {recommendation: MONITOR, steps: ["Address validation"], sla: "N/A"}
exceptions: []
compliance_refs: ["Installment Policy §Fraud"]
tags: ["installment","large_early","new_device","reshipper"]