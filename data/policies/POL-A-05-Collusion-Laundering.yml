    HIGH: {recommendation: ESCALATE, steps: ["Suspend settlement", "KYB review"], sla: "4h",
           evidence_checklist: ["Settlement account links", "IP overlap"] }
    MEDIUM: {recommendation: REQUEST_DOCS, steps: ["Explain MCC variance"], sla: "24h", evidence_checklist: ["Invoices"] }
    LOW: {recommendation: MONITOR, steps: ["Sampling audits"], sla: "N/A"}
exceptions: []
